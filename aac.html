<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التواصل البديل والمعزز (AAC) | بصمة أمل - HOPE TOUCH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/accessibility.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body class="child-mode">
  <header></header>

  <main class="container" style="margin-top: 25px; margin-bottom: 60px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
      <div>
        <h1 style="font-size: 1.8rem; margin: 0; color: var(--primary);">
          <i class="fa-solid fa-comment-dots"></i> لوحة بطاقات التواصل البديل والمعزز (PECS / AAC)
        </h1>
        <p style="color: var(--text-muted); margin: 4px 0 0 0;">
          اضغط على الرمز ليتحدث بصوتك! عبر عن رغباتك ومشاعرك بكل سهولة واستقلالية.
        </p>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-outline-primary" onclick="openAddSymbolModal()">
          <i class="fa-solid fa-plus"></i> إضافة رمز مخصص (للمعلم)
        </button>
        <button class="btn btn-outline-secondary" onclick="toggleCalmMode()">
          <i class="fa-solid fa-feather"></i> هدوء حسي 🍃
        </button>
      </div>
    </div>

    <!-- شريط تكوين الجملة (Sentence Strip) -->
    <section class="interactive-card" style="background:#ffffff; border: 3px solid var(--primary); padding: 18px 24px; border-radius: 24px; margin-bottom: 25px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px;">
        <span style="font-weight: 800; font-size: 1.15rem; color: var(--primary);">
          <i class="fa-solid fa-layer-group"></i> شريط الجملة المصورة المنطوقة:
        </span>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-lg btn-success animate__animated animate__pulse animate__infinite" onclick="speakSentence()" style="font-size: 1.2rem; border-radius: 999px; padding: 10px 28px;">
            <i class="fa-solid fa-volume-high"></i> انطق جملتي 🔊
          </button>
          <button class="btn btn-outline-danger" onclick="clearSentence()" style="border-radius: 999px;">
            <i class="fa-solid fa-trash"></i> مسح الشريط
          </button>
        </div>
      </div>

      <div id="sentenceStrip" style="min-height: 95px; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 18px; display: flex; align-items: center; gap: 14px; padding: 12px 20px; overflow-x: auto;">
        <span id="stripPlaceholder" style="color:#94a3b8; font-size:1.05rem;">(المس أي بطاقة من الأسفل لإضافتها إلى شريط الجملة وسماع نطقها فورًا)</span>
      </div>
    </section>

    <!-- تصنيفات بطاقات التواصل -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
      <button class="btn btn-primary" onclick="showCategory('needs', this)">🍽️ الاحتياجات الأساسية</button>
      <button class="btn btn-outline-primary" onclick="showCategory('emotions', this)">😊 المشاعر والتعبير</button>
      <button class="btn btn-outline-primary" onclick="showCategory('custom', this)">⭐ رموز مخصصة للطفل</button>
    </div>

    <!-- شبكة بطاقات PECS الكبيرة -->
    <div id="aacGrid" class="row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 18px;">
      <!-- Cards rendered here -->
    </div>

  </main>

  <!-- Modal إضافة رمز تواصل مخصص بواسطة المعلم -->
  <div id="addSymbolModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">
    <div class="interactive-card" style="background:#ffffff; max-width:550px; width:90%; padding:25px; border-radius:24px; text-align:right;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0; color:var(--primary);"><i class="fa-solid fa-circle-plus"></i> إضافة رمز تواصل مخصص لبيئة الطفل</h3>
        <button class="btn btn-sm btn-outline-danger" onclick="closeAddSymbolModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="handleCreateSymbol(event)">
        <div class="form-group">
          <label>العبارة أو الكلمة المعروضة على البطاقة</label>
          <input type="text" id="symText" class="form-control" placeholder="مثال: أريد وجبة خفيفة" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>الأيقونة أو الرمز التعبيري (Emoji)</label>
            <input type="text" id="symEmoji" class="form-control" placeholder="مثال: 🍪 أو 🥤" required>
          </div>
          <div class="form-group">
            <label>التصنيف</label>
            <select id="symCategory" class="form-control">
              <option value="needs">احتياجات ورغبات</option>
              <option value="emotions">مشاعر وأحاسيس</option>
              <option value="custom" selected>رموز خاصة بالطفل</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>النص المنطوق صوتيًا عند لمس البطاقة</label>
          <input type="text" id="symSpeech" class="form-control" placeholder="مثال: أريد أن آكل بسكويت لذيذ من فضلك" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">
          <i class="fa-solid fa-check"></i> حفظ الرمز المخصص في لوحة الطفل
        </button>
      </form>
    </div>
  </div>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/speech.js"></script>
  <script src="assets/js/accessibility.js"></script>
  <script src="assets/js/api-client.js"></script>
  <script>
    const CORE_AAC = {
      needs: [
        { id: 1, text: 'أريد أن آكل', emoji: '🍽️', speech: 'أنا جائع، أريد أن آكل طعامًا لذيذًا' },
        { id: 2, text: 'أريد أن أشرب', emoji: '🥛', speech: 'أنا عطشان، أريد أن أشرب ماء نظيف' },
        { id: 3, text: 'أريد المساعدة', emoji: '🆘', speech: 'من فضلك، أحتاج مساعدتك يا معلمتي' },
        { id: 4, text: 'أريد الراحة', emoji: '🛋️', speech: 'أشعر بالتعب، أريد أن أرتاح قليلاً' },
        { id: 5, text: 'أريد اللعب', emoji: '🧸', speech: 'أريد أن ألعب بألعابي الجميلة' },
        { id: 6, text: 'أريد الذهاب إلى الحمام', emoji: '🚽', speech: 'أحتاج الذهاب إلى الحمام من فضلك' }
      ],
      emotions: [
        { id: 7, text: 'أنا سعيد', emoji: '😊', speech: 'أنا سعيد وفرحان اليوم!' },
        { id: 8, text: 'أنا حزين', emoji: '😢', speech: 'أنا حزين، أحتاج إلى حضن ومواساة' },
        { id: 9, text: 'أنا غاضب', emoji: '😠', speech: 'أنا أشعر بالغضب، أحتاج بيئة هادئة' }
      ]
    };

    let selectedStripCards = [];
    let customSymbols = [];

    document.addEventListener('DOMContentLoaded', async () => {
      HopeApi.renderHeader('aac');
      A11y.init();
      AppCore.initAudio();

      // Load custom symbols for child 1
      const res = await HopeApi.getAacSymbols(1);
      if (res.ok && res.data) {
        customSymbols = res.data;
      }

      showCategory('needs');
    });

    function showCategory(catKey, btn = null) {
      if (btn) {
        document.querySelectorAll('button[onclick*="showCategory"]').forEach(b => {
          b.className = 'btn btn-outline-primary';
        });
        btn.className = 'btn btn-primary';
      }

      const grid = document.getElementById('aacGrid');
      let items = [];

      if (catKey === 'custom') {
        items = customSymbols;
      } else {
        items = CORE_AAC[catKey] || [];
      }

      if (items.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#64748b;">لا توجد رموز مخصصة بعد، يمكن للمعلم إضافتها بالأعلى</div>';
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="interactive-card text-center animate__animated animate__zoomIn" onclick="selectCard('${item.text}', '${item.emoji}', '${item.speech}')" style="cursor:pointer; padding:22px 14px; border-radius:24px; box-shadow:var(--shadow-toy); border: 2.5px solid transparent; transition: all 0.2s;">
          <div style="font-size:65px; margin-bottom:10px;">${item.emoji}</div>
          <span style="font-size:1.25rem; font-weight:900; color:var(--text-main); display:block; line-height:1.3;">${item.text}</span>
        </div>
      `).join('');

      AppCore.playSound('pop');
    }

    function selectCard(text, emoji, speech) {
      AppCore.playSound('pop');
      SpeechEngine.speak(speech || text);

      selectedStripCards.push({ text, emoji, speech });
      renderSentenceStrip();
    }

    function renderSentenceStrip() {
      const strip = document.getElementById('sentenceStrip');
      const placeholder = document.getElementById('stripPlaceholder');
      if (placeholder) placeholder.style.display = 'none';

      strip.innerHTML = selectedStripCards.map(item => `
        <div class="interactive-card animate__animated animate__bounceIn" style="margin:0; padding:10px 18px; background:#eff6ff; border:2px solid #bfdbfe; border-radius:16px; display:flex; align-items:center; gap:10px;">
          <span style="font-size:36px;">${item.emoji}</span>
          <span style="font-size:1.2rem; font-weight:900; color:var(--primary);">${item.text}</span>
        </div>
      `).join('');
    }

    async function speakSentence() {
      if (selectedStripCards.length === 0) {
        SpeechEngine.speak('من فضلك اختر بطاقة من الأسفل أولاً للتعبير عما تريد.');
        return;
      }

      const fullSentence = selectedStripCards.map(c => c.text).join(' ، و ');
      SpeechEngine.speak(fullSentence);
      AppCore.celebrate();
      AppCore.playSound('celebrate');

      // Record AAC Communication Attempt
      await HopeApi.recordAttempt({
        activityId: 2,
        score: 100,
        duration: 10,
        helpType: 'none',
        promptNotes: `تواصل مستقل ناجح: ${fullSentence}`,
        success: true
      });
    }

    function clearSentence() {
      selectedStripCards = [];
      const strip = document.getElementById('sentenceStrip');
      strip.innerHTML = `<span id="stripPlaceholder" style="color:#94a3b8; font-size:1.05rem;">(المس أي بطاقة من الأسفل لإضافتها إلى شريط الجملة وسماع نطقها فورًا)</span>`;
      AppCore.playSound('click');
    }

    function openAddSymbolModal() {
      document.getElementById('addSymbolModal').style.display = 'flex';
    }

    function closeAddSymbolModal() {
      document.getElementById('addSymbolModal').style.display = 'none';
    }

    async function handleCreateSymbol(e) {
      e.preventDefault();
      const payload = {
        child_id: 1,
        text: document.getElementById('symText').value.trim(),
        emoji: document.getElementById('symEmoji').value.trim() || '⭐',
        category: document.getElementById('symCategory').value,
        speech: document.getElementById('symSpeech').value.trim()
      };

      const res = await HopeApi.createAacSymbol(payload);
      if (res.ok) {
        AppCore.celebrate();
        alert('تمت إضافة رمز التواصل المخصص بنجاح إلى لوحة الطفل.');
        customSymbols.push(res.data);
        closeAddSymbolModal();
        showCategory('custom');
      } else {
        alert(res.data.error || 'فشل حفظ الرمز');
      }
    }

    function toggleCalmMode() {
      document.body.classList.toggle('sensory-calm');
      AppCore.playSound('pop');
    }
  </script>
</body>
</html>
